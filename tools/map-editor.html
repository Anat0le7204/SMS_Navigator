    let lx, ly, ln, lfi;
    if (s.type === 'node') {
      const n = d.nodes[s.ni];
      lx = n[0]; ly = n[1]; ln = n[4]; lfi = n[2];
    } else if (s.type === 'poly') {
      const flp = d.floors[s.fi], po2 = flp.polys[s.pi];
      if (!po2) return;
      let sx = 0, sy = 0;
      for (let i = 0; i < po2.p.length; i += 2) { sx += po2.p[i]; sy += po2.p[i + 1]; }
      lx = sx / (po2.p.length / 2); ly = sy / (po2.p.length / 2);
      ln = po2.n || ''; lfi = s.fi;
    } else return;
    const lb = { n: ln, x: lx, y: ly, c: 'workstationaction' };
    const target = d.floors[lfi];
    pushCmd('添加标签', [insPatch(target.labels, target.labels.length, [lb])]);
    rebuildLinks();
    state.sel = { type: 'label', fi: lfi, li: target.labels.length - 1 };
    renderPropPanel(); render();
  };
}

function onPropChange(e) {
  const d = state.data, sel = state.sel;
  const k = e.target.dataset.k;
  if (!d) return;
  // meta 编辑无需选中实体
  if (k && k.indexOf('meta.') === 0) {
    const v0 = e.target.value;
    const mkey = k.slice(5);
    let mg = [];
    if (mkey === 'name' || mkey === 'source') mg = [setPatch(d.meta, mkey, v0)];
    else if (mkey === 'unitPerMeter') mg = [setPatch(d.meta, mkey, Number(v0))];
    if (mg.length) pushCmd('修改元数据', mg);
    return;
  }
  if (!sel || !selExists(sel)) return;
  const v = e.target.value;
  let geo = [];
  let derive = null;

  if (sel.type === 'node') {
    const n = d.nodes[sel.ni];
    if (k === 'node.x') { geo = moveNodePatches(sel.ni, Number(v), n[1]); derive = () => recalcKind0Patches([sel.ni]); }
    else if (k === 'node.y') { geo = moveNodePatches(sel.ni, n[0], Number(v)); derive = () => recalcKind0Patches([sel.ni]); }
    else if (k === 'node.floor') {
      // Q1 联动：节点换层时 POI.f 跟随，标签随迁到新层
      const newFi = Number(v), oldFi = n[2];
      geo.push(setPatch(n, 2, newFi));
      const poiIdx = links.nodePoi.get(sel.ni);
      if (poiIdx !== undefined && d.floors[newFi]) {
        geo.push(setPatch(d.pois[poiIdx], 'f', d.floors[newFi].id));
      }
      const lab = links.nodeLabel.get(sel.ni);
      if (lab && lab.fi !== newFi && d.floors[newFi]) {
        const lb = d.floors[lab.fi].labels[lab.li];
        geo.push(delPatch(d.floors[lab.fi].labels, lab.li, [lb]));
        geo.push(insPatch(d.floors[newFi].labels, d.floors[newFi].labels.length, [lb]));
      }
    }
    else if (k === 'node.code') geo = [setPatch(n, 3, v)];
    else if (k === 'node.name') geo = renameNodePatches(sel.ni, v);
    else if (k === 'node.building') geo = [setPatch(n, 5, v)];
  } else if (sel.type === 'edge') {
    const ed = d.edges[sel.ei];
    if (k === 'edge.w') geo = [setPatch(ed, 2, Number(v))];
    else if (k === 'edge.kind') geo = [setPatch(ed, 3, Number(v))];
  } else if (sel.type === 'poi') {
    const p = d.pois[sel.pi];
    const map = { 'poi.id': 'id', 'poi.n': 'n', 'poi.f': 'f', 'poi.x': 'x', 'poi.y': 'y', 'poi.t': 't', 'poi.b': 'b', 'poi.i': 'i' };
    const key = map[k];
    if (key) {
      const nv = (key === 'x' || key === 'y' || key === 'i') ? Number(v) : v;
      if (key === 'n' && p.i >= 0 && p.i < d.nodes.length) {
        // name 映射联动：本 POI + 节点/标签/同名多边形（覆盖多 POI 共节点场景）
        geo = [setPatch(p, 'n', v)].concat(renameNodePatches(p.i, v));
      } else {
        geo = [setPatch(p, key, nv)];
      }
    }
  } else if (sel.type === 'poly') {
    const po = d.floors[sel.fi].polys[sel.pi];
    if (!po) return;
    if (k === 'poly.t') geo = [setPatch(po, 't', v)];
    else if (k === 'poly.n') geo = [setPatch(po, 'n', v)];
  } else if (sel.type === 'label') {
    const lb = d.floors[sel.fi].labels[sel.li];
    if (!lb) return;
    const map = { 'label.n': 'n', 'label.x': 'x', 'label.y': 'y', 'label.c': 'c' };
    const key = map[k];
    if (key) {
      const nv = (key === 'x' || key === 'y') ? Number(v) : v;
      geo = [setPatch(lb, key, nv)];
      if (key === 'n') {
        const ni = links.labelNode.get(sel.fi * 1e7 + sel.li);
        if (ni !== undefined) geo = renameNodePatches(ni, v);
      }
    }
  } else if (sel.type === 'floor') {
    const fl = d.floors[sel.fi];
    if (!fl) return;
    const map = { 'floor.id': 'id', 'floor.name': 'name', 'floor.note': 'note', 'floor.level': 'level', 'floor.kind': 'kind' };
    const key = map[k];
    if (key) {
      const nv = key === 'level' ? Number(v) : v;
      if (key === 'id') {
        const oldId = fl.id;
        geo.push(setPatch(fl, 'id', nv));
        const fo = d.meta.floorOrder;
        const idx2 = fo.indexOf(oldId);
        if (idx2 >= 0) {
          const nf = fo.slice(); nf[idx2] = nv;
          geo.push(setPatch(d.meta, 'floorOrder', nf));
        }
        d.pois.forEach(p => { if (p.f === oldId) geo.push(setPatch(p, 'f', nv)); });
        if (state.floorId === oldId) state.floorId = nv;
      } else {
        geo.push(setPatch(fl, key, nv));
      }
    }
  }
  if (geo.length) {
    pushCmd('修改属性', withDerive(geo, derive));
    rebuildLinks();
  }
  render();
}

// ============================== 删除（级联规则 §6.5） ==============================
function deleteNodes(idxs) {
  const d = state.data;
  const set = new Set(idxs);
  let edgeCnt = 0, poiCnt = 0, labCnt = 0;
  d.edges.forEach(e => { if (set.has(e[0]) || set.has(e[1])) edgeCnt++; });
  const poiIdxs = [];
  d.pois.forEach((p, i) => { if (set.has(p.i)) { poiCnt++; poiIdxs.push(i); } });
  const labs = [];
  idxs.forEach(ni => {
    const lab = links.nodeLabel.get(ni);
    if (lab) { labCnt++; labs.push(lab); }
  });
  const edgeChk = edgeCnt
    ? '<p><label class="chk"><input type="checkbox" id="delEdgeChk" checked>同时删除关联边（' + edgeCnt + ' 条）</label></p>'
    : '';
  showModal('删除节点',
    '<p>将删除 <b>' + idxs.length + '</b> 个节点。</p>' +
    edgeChk +
    '<p>级联影响：<b>' + edgeCnt + '</b> 条边、<b>' + poiCnt + '</b> 个兴趣点、<b>' + labCnt + '</b> 个标签（关联数据将一并删除）。</p>' +
    '<p class="hint">未勾选时，仍被边引用的节点会被阻止删除。</p>',
    [
      { label: '取消' },
      { label: '删除', cls: 'danger', fn: () => {
        const withEdges = !edgeCnt || ($('delEdgeChk') && $('delEdgeChk').checked);
        if (!withEdges) {
          // §6.5：阻止删除仍被边引用的节点
          const blocked = idxs.length;
          showModal('已阻止删除',
            '<p><b>' + blocked + '</b> 个节点仍被 <b>' + edgeCnt + '</b> 条边引用，未勾选「同时删除关联边」。</p>' +
            '<p class="hint">请勾选后重试，或先删除相关边。</p>',
            [{ label: '知道了' }]);
          return;
        }
        doDeleteNodes(idxs, poiIdxs, labs);
      } }
    ]);
}
function doDeleteNodes(idxs, poiIdxs, labs) {
  const d = state.data;
  const set = new Set(idxs);
  const patches = [];
  poiIdxs.slice().sort((a, b) => b - a).forEach(i => {
    patches.push(delPatch(d.pois, i, [d.pois[i]]));
  });
  labs.slice().sort((a, b) => b.fi - a.fi || b.li - a.li).forEach(l => {
    patches.push(delPatch(d.floors[l.fi].labels, l.li, [d.floors[l.fi].labels[l.li]]));
  });
  const edgeIdxs = [];
  d.edges.forEach((e, i) => { if (set.has(e[0]) || set.has(e[1])) edgeIdxs.push(i); });
  edgeIdxs.sort((a, b) => b - a).forEach(i => {
    patches.push(delPatch(d.edges, i, [d.edges[i]]));
  });
  const sorted = idxs.slice().sort((a, b) => b - a);
  sorted.forEach(ni => {
    patches.push(delPatch(d.nodes, ni, [d.nodes[ni]]));
  });
  // 引用下标修正（对未删除的边/POI）
  d.edges.forEach((e, ei) => {
    if (set.has(e[0]) || set.has(e[1])) return;
    let a = e[0], b = e[1], ch = false;
    sorted.forEach(ni => {
      if (a > ni) { a--; ch = true; }
      if (b > ni) { b--; ch = true; }
    });
    if (ch) patches.push(setPatch(e, 0, a), setPatch(e, 1, b));
  });
  d.pois.forEach((p, pi) => {
    if (set.has(p.i)) return;
    let ii = p.i, ch = false;
    sorted.forEach(ni => { if (ii > ni) { ii--; ch = true; } });
    if (ch) patches.push(setPatch(p, 'i', ii));
  });
  pushCmd('删除 ' + idxs.length + ' 个节点', patches);
  state.sel = null; state.multi = null;
  rebuildLinks(); renderPropPanel(); render();
}
function deleteSelection() {
  const sel = state.sel;
  if (!sel) {
    if (state.multi && state.multi.length) deleteNodes(state.multi.slice());
    return;
  }
  const d = state.data;
  if (sel.type === 'node') { deleteNodes([sel.ni]); return; }
  if (sel.type === 'edge') {
    showModal('删除边', '<p>删除边 #' + sel.ei + '？</p>', [
      { label: '取消' },
      { label: '删除', cls: 'danger', fn: () => {
        pushCmd('删除边', [delPatch(d.edges, sel.ei, [d.edges[sel.ei]])]);
        state.sel = null; renderPropPanel(); render();
      } }
    ]);
    return;
  }
  if (sel.type === 'poi') {
    showModal('删除兴趣点', '<p>删除兴趣点 #' + sel.pi + '（' + esc(d.pois[sel.pi].n) + '）？</p>', [
      { label: '取消' },
      { label: '删除', cls: 'danger', fn: () => {
        pushCmd('删除兴趣点', [delPatch(d.pois, sel.pi, [d.pois[sel.pi]])]);
        state.sel = null; rebuildLinks(); renderPropPanel(); render();
      } }
    ]);
    return;
  }
  if (sel.type === 'label') {
    const lb = d.floors[sel.fi].labels[sel.li];
    showModal('删除标签', '<p>删除标签「' + esc(lb.n) + '」？</p>', [
      { label: '取消' },
      { label: '删除', cls: 'danger', fn: () => {
        pushCmd('删除标签', [delPatch(d.floors[sel.fi].labels, sel.li, [lb])]);
        state.sel = null; rebuildLinks(); renderPropPanel(); render();
      } }
    ]);
    return;
  }
  if (sel.type === 'poly') {
    const po = d.floors[sel.fi].polys[sel.pi];
    showModal('删除多边形', '<p>删除多边形（' + polyTypeName(po.t) + (po.n ? ' · ' + esc(po.n) : '') + '，' + (po.p.length / 2) + ' 个顶点）？</p>', [
      { label: '取消' },
      { label: '删除', cls: 'danger', fn: () => {
        const fi = sel.fi;
        const geo = [delPatch(d.floors[fi].polys, sel.pi, [po])];
        pushCmd('删除多边形', withDerive(geo, () => recalcBoundsPatch(fi)));
        state.sel = null; renderPropPanel(); render();
      } }
    ]);
    return;
  }
  if (sel.type === 'floor') { deleteFloor(sel.fi); return; }
}

function deleteFloor(fi) {
  const d = state.data;
  const fl = d.floors[fi];
  if (d.floors.length <= 1) { showModal('无法删除', '<p>不能删除最后一个楼层。</p>', [{ label: '知道了' }]); return; }
  let nodeCnt = 0;
  d.nodes.forEach(n => { if (n[2] === fi) nodeCnt++; });
  showModal('删除楼层',
    '<p>删除楼层 <b>' + esc(fl.id) + '</b>（垂直层级 ' + fl.level + '）？</p>' +
    '<p>该层有 <b>' + nodeCnt + '</b> 个节点、' + fl.polys.length + ' 个多边形、' + fl.labels.length + ' 个标签。</p>' +
    '<p class="hint">必须连带删除层内全部数据，并修正其余节点的楼层索引引用。此操作可以撤销。</p>',
    [
      { label: '取消' },
      { label: '级联删除', cls: 'danger', fn: () => {
        const patches = [];
        const idxs = [];
        d.nodes.forEach((n, i) => { if (n[2] === fi) idxs.push(i); });
        const set = new Set(idxs);
        const poiIdxs = [];
        d.pois.forEach((p, i) => { if (set.has(p.i)) poiIdxs.push(i); });
        poiIdxs.slice().sort((a, b) => b - a).forEach(i => patches.push(delPatch(d.pois, i, [d.pois[i]])));
        for (let li = fl.labels.length - 1; li >= 0; li--) {
          patches.push(delPatch(fl.labels, li, [fl.labels[li]]));
        }
        const edgeIdxs = [];
        d.edges.forEach((e, i) => { if (set.has(e[0]) || set.has(e[1])) edgeIdxs.push(i); });
        edgeIdxs.sort((a, b) => b - a).forEach(i => patches.push(delPatch(d.edges, i, [d.edges[i]])));
        const sorted = idxs.slice().sort((a, b) => b - a);
        sorted.forEach(ni => patches.push(delPatch(d.nodes, ni, [d.nodes[ni]])));
        // 引用修正（未删除实体）
        d.edges.forEach(e => {
          if (set.has(e[0]) || set.has(e[1])) return;
          let a = e[0], b = e[1], ch = false;
          sorted.forEach(ni => { if (a > ni) { a--; ch = true; } if (b > ni) { b--; ch = true; } });
          if (ch) patches.push(setPatch(e, 0, a), setPatch(e, 1, b));
        });
        d.pois.forEach(p => {
          if (set.has(p.i)) return;
          let ii = p.i, ch = false;
          sorted.forEach(ni => { if (ii > ni) { ii--; ch = true; } });
          if (ch) patches.push(setPatch(p, 'i', ii));
        });
        d.nodes.forEach(n => {
          if (n[2] > fi) patches.push(setPatch(n, 2, n[2] - 1));
        });
        patches.push(delPatch(d.floors, fi, [fl]));
        patches.push(setPatch(d.meta, 'floorOrder', d.meta.floorOrder.filter(id => id !== fl.id)));
        pushCmd('删除楼层 ' + fl.id, patches);
        const remain = d.floors[Math.min(fi, d.floors.length - 1)];
        state.floorId = remain ? remain.id : null;
        state.sel = null;
        rebuildLinks(); renderRail(); renderPropPanel(); render();
      } }
    ]);
}

// ============================== 校验器 ==============================
function validate() {
  const d = state.data;
  const errors = [], warns = [];
  const floorIds = new Set(), foSet = new Set();
  d.floors.forEach(f => {
    if (floorIds.has(f.id)) errors.push('楼层编号重复：' + f.id);
    floorIds.add(f.id);
  });
  d.meta.floorOrder.forEach(id => {
    if (foSet.has(id)) errors.push('楼层顺序中重复出现：' + id);
    foSet.add(id);
    if (!floorIds.has(id)) errors.push('楼层顺序引用了不存在的楼层：' + id);
  });
  d.floors.forEach(f => {
    if (!foSet.has(f.id)) errors.push('楼层顺序缺少楼层：' + f.id);
  });
  d.nodes.forEach((n, i) => {
    if (n[2] < 0 || n[2] >= d.floors.length) errors.push('nodes[' + i + '] 楼层索引越界：' + n[2]);
  });
  const pairCnt = new Map();
  d.edges.forEach((e, i) => {
    const a = e[0], b = e[1], w = e[2], k = e[3];
    if (a < 0 || a >= d.nodes.length) errors.push('edges[' + i + '] 起点越界：' + a);
    if (b < 0 || b >= d.nodes.length) errors.push('edges[' + i + '] 终点越界：' + b);
    if (a === b) errors.push('edges[' + i + '] 自环（起终点相同）：' + a);
    if (!(w > 0)) errors.push('edges[' + i + '] 长度权重非法：' + w);
    if (k !== 0 && k !== 1 && k !== 2 && k !== 3) errors.push('edges[' + i + '] 边类型非法：' + k);
    if (a >= 0 && a < d.nodes.length && b >= 0 && b < d.nodes.length && a !== b) {
      const key = Math.min(a, b) + ',' + Math.max(a, b);
      pairCnt.set(key, (pairCnt.get(key) || 0) + 1);
      const na = d.nodes[a], nb = d.nodes[b];
      if (na[2] !== nb[2] && k === 0) warns.push('edges[' + i + '] 跨层步行边（疑似漏标为楼梯 / 电梯）：' + (na[4] || a) + ' → ' + (nb[4] || b));
      // 零长边仅对同层边告警：跨层楼梯/电梯节点同坐标是正常形态
      if (na[2] === nb[2] && na[0] === nb[0] && na[1] === nb[1]) warns.push('edges[' + i + '] 零长边（两端坐标重合）：' + (na[4] || a) + ' = ' + (nb[4] || b));
    }
  });
  pairCnt.forEach((c, key) => {
    if (c > 1) warns.push('重复边 ×' + c + '：节点对 ' + key);
  });
  d.pois.forEach((p, i) => {
    if (p.i < 0 || p.i >= d.nodes.length) { errors.push('pois[' + i + '] 关联节点索引越界：' + p.i); return; }
    const n = d.nodes[p.i];
    const fid = d.floors[n[2]] ? d.floors[n[2]].id : '?';
    if (p.f !== fid) warns.push('pois[' + i + ']（' + p.n + '）所在楼层 ' + p.f + ' 与关联节点的楼层 ' + fid + ' 不一致');
  });
  // 连通分量
  const N = d.nodes.length;
  const adj = Array.from({ length: N }, () => []);
  d.edges.forEach(e => {
    const a = e[0], b = e[1];
    if (a >= 0 && a < N && b >= 0 && b < N && a !== b) { adj[a].push(b); adj[b].push(a); }
  });
  const comp = new Int32Array(N).fill(-1);
  let compId = 0;
  for (let i = 0; i < N; i++) {
    if (comp[i] !== -1) continue;
    const q = [i]; comp[i] = compId;
    while (q.length) {
      const u = q.pop();
      adj[u].forEach(v => { if (comp[v] === -1) { comp[v] = compId; q.push(v); } });
    }
    compId++;
  }
  const compSize = new Array(compId).fill(0);
  for (let i = 0; i < N; i++) compSize[comp[i]]++;
  let mainComp = 0;
  compSize.forEach((s, c) => { if (s > compSize[mainComp]) mainComp = c; });
  d.nodes.forEach((n, i) => {
    const fl = d.floors[n[2]];
    if (adj[i].length === 0 && fl && fl.kind !== 'outdoor') {
      warns.push('孤立节点 #' + i + '（' + (n[4] || n[3] || '无名') + '）@' + fl.id);
    }
  });
  d.pois.forEach((p, i) => {
    if (p.i >= 0 && p.i < N && comp[p.i] !== mainComp) {
      warns.push('pois[' + i + ']（' + p.n + '）不在主连通分量');
    }
  });
  // 失联影子实体（Q1 兜底）
  d.floors.forEach((fl, fi) => {
    (fl.labels || []).forEach((lb, li) => {
      const ni = links.labelNode.get(fi * 1e7 + li);
      if (ni === undefined) {
        warns.push('标签失联：「' + lb.n + '」@' + fl.id + ' 无坐标重合节点');
      } else {
        const n = d.nodes[ni];
        if (n[4] !== lb.n) warns.push('标签名不一致：「' + lb.n + '」vs 节点「' + n[4] + '」@' + fl.id);
      }
    });
    (fl.polys || []).forEach(po => {
      if (po.t === 'room' && po.n) {
        const hasNode = d.nodes.some(n => n[2] === fi && n[4] === po.n);
        if (!hasNode) warns.push('房间多边形「' + po.n + '」@' + fl.id + ' 无同名节点');
      }
    });
  });
  // POI↔节点坐标漂移（Q1 兜底，容差 1 单位）
  d.pois.forEach((p, i) => {
    if (p.i < 0 || p.i >= d.nodes.length) return;
    const n = d.nodes[p.i];
    if (Math.hypot(p.x - n[0], p.y - n[1]) > 1) {
      warns.push('pois[' + i + ']（' + p.n + '）坐标与节点 #' + p.i + ' 漂移 ' +
        Math.hypot(p.x - n[0], p.y - n[1]).toFixed(1) + ' 单位');
    }
  });
  // 未知枚举值提示（§6.3 允许扩展，但校验器提示）
  const knownCodes = new Set(Object.keys(NODE_COLORS).concat(['', 'road']));
  d.nodes.forEach((n, i) => {
    if (n[3] && !knownCodes.has(n[3])) warns.push('nodes[' + i + '] 未知类型编码：' + n[3]);
  });
  d.floors.forEach((fl, fi) => {
    (fl.polys || []).forEach((po, pi) => {
      if (POLY_TYPES.indexOf(po.t) < 0) warns.push('多边形 [' + fi + ',' + pi + '] 未知区域类型：' + po.t);
    });
    (fl.labels || []).forEach((lb, li) => {
      if (LABEL_CODES.indexOf(lb.c) < 0) warns.push('标签 [' + fi + ',' + li + '] 未知标签类别：' + lb.c);
    });
  });
  return { errors, warns, mainCompSize: compSize[mainComp], mainComp };
}

function renderValPanel(result) {
  if (!result) { valPanel.innerHTML = '<div class="empty">尚未校验。点击工具栏「校验」生成报告。</div>'; return; }
  const errors = result.errors, warns = result.warns;
  if (!errors.length && !warns.length) {
    valPanel.innerHTML = '<div class="empty">✓ 未发现问题（主连通分量 ' + result.mainCompSize + ' 节点）。</div>';
    return;
  }
  let html = '<div class="hint">错误 <b style="color:var(--err)">' + errors.length + '</b> · 警告 <b style="color:var(--warn)">' + warns.length + '</b> · 主连通分量 ' + result.mainCompSize + ' 节点</div>';
  html += errors.map((m, i) => '<div class="val-item err" data-v="e' + i + '"><span class="lv">错误</span> ' + esc(m) + '</div>').join('');
  html += warns.map((m, i) => '<div class="val-item warn" data-v="w' + i + '"><span class="lv">警告</span> ' + esc(m) + '</div>').join('');
  valPanel.innerHTML = html;
  valPanel.querySelectorAll('.val-item').forEach(el => {
    el.onclick = () => locateIssue(el.dataset.v.charAt(0) === 'e' ? errors : warns, Number(el.dataset.v.slice(1)));
  });
}
function locateIssue(list, idx) {
  const msg = list[idx];
  const d = state.data;
  let m;
  if ((m = msg.match(/nodes\[(\d+)\]/))) state.sel = { type: 'node', ni: +m[1] };
  else if ((m = msg.match(/edges\[(\d+)\]/))) state.sel = { type: 'edge', ei: +m[1] };
  else if ((m = msg.match(/pois\[(\d+)\]/))) state.sel = { type: 'poi', pi: +m[1] };
  else if ((m = msg.match(/节点 #(\d+)/))) state.sel = { type: 'node', ni: +m[1] };
  else if ((m = msg.match(/多边形 \[(\d+),(\d+)\]/))) {
    const fii = +m[1];
    state.sel = { type: 'poly', fi: fii, pi: +m[2] };
    if (d.floors[fii]) state.floorId = d.floors[fii].id;
    renderRail(); renderPropPanel(); render();
    return;
  } else if ((m = msg.match(/标签 \[(\d+),(\d+)\]/))) {
    const fii = +m[1];
    state.sel = { type: 'label', fi: fii, li: +m[2] };
    if (d.floors[fii]) state.floorId = d.floors[fii].id;
    renderRail(); renderPropPanel(); render();
    return;
  } else if ((m = msg.match(/「(.+?)」@(B?\w+)/))) {
    // 「name」@floorId —— 标签/多边形/楼层相关告警
    const name = m[1], fid = m[2];
    const fii = d.floors.findIndex(f => f.id === fid);
    if (fii >= 0) {
      state.floorId = fid;
      const li = (d.floors[fii].labels || []).findIndex(l => l.n === name);
      if (li >= 0) {
        state.sel = { type: 'label', fi: fii, li };
        const lb = d.floors[fii].labels[li];
        state.view.x = lb.x; state.view.y = lb.y;
      } else {
        const pi = (d.floors[fii].polys || []).findIndex(p => p.n === name);
        if (pi >= 0) state.sel = { type: 'poly', fi: fii, pi };
      }
      renderRail(); renderPropPanel(); render();
      return;
    }
  }
  if (state.sel && state.sel.type === 'node') {
    const n = state.data.nodes[state.sel.ni];
    if (n) {
      state.floorId = state.data.floors[n[2]] ? state.data.floors[n[2]].id : state.floorId;
      state.view.x = n[0]; state.view.y = n[1];
    }
  } else if (state.sel && state.sel.type === 'poi') {
    const p = state.data.pois[state.sel.pi];
    if (p) { state.floorId = p.f; state.view.x = p.x; state.view.y = p.y; }
  } else if (state.sel && state.sel.type === 'edge') {
    const ed = state.data.edges[state.sel.ei];
    const n = ed && state.data.nodes[ed[0]];
    if (n) {
      state.floorId = state.data.floors[n[2]] ? state.data.floors[n[2]].id : state.floorId;
      state.view.x = n[0]; state.view.y = n[1];
    }
  }
  renderRail(); renderPropPanel(); render();
}

// ============================== 搜索 ==============================
const searchList = $('searchList');
$('searchBox').addEventListener('input', () => {
  const q = $('searchBox').value.trim().toLowerCase();
  if (!q || !state.data) { searchList.style.display = 'none'; return; }
  const d = state.data, items = [];
  d.pois.forEach((p, pi) => {
    if (items.length >= 30) return;
    if (p.n && p.n.toLowerCase().indexOf(q) >= 0) items.push({ kind: '兴趣点', name: p.n, meta: p.t + ' · ' + p.f, pi });
  });
  d.nodes.forEach((n, ni) => {
    if (items.length >= 30) return;
    if (n[4] && n[4].toLowerCase().indexOf(q) >= 0) items.push({ kind: '节点', name: n[4], meta: (n[3] ? codeName(n[3]) : '–') + ' · ' + (d.floors[n[2]] ? d.floors[n[2]].id : '?'), ni });
  });
  d.floors.forEach((fl, fi) => {
    (fl.labels || []).forEach((lb, li) => {
      if (items.length >= 30) return;
      if (lb.n && lb.n.toLowerCase().indexOf(q) >= 0) items.push({ kind: '标签', name: lb.n, meta: labelCodeName(lb.c) + ' · ' + fl.id, fi, li });
    });
  });
  if (!items.length) {
    searchList.innerHTML = '<div class="item"><span class="meta2">无匹配结果</span></div>';
    searchList.style.display = 'block';
    return;
  }
  searchList.innerHTML = items.map((it, i) =>
    '<div class="item" data-i="' + i + '"><span class="nm">' + esc(it.name) + '</span><span class="meta2">' + it.kind + ' · ' + esc(it.meta) + '</span></div>'
  ).join('');
  searchList.style.display = 'block';
  searchList.querySelectorAll('.item').forEach(el => {
    el.onclick = () => {
      const it = items[Number(el.dataset.i)];
      if (it.pi !== undefined) {
        const p = state.data.pois[it.pi];
        state.sel = { type: 'poi', pi: it.pi };
        state.floorId = p.f; state.view.x = p.x; state.view.y = p.y;
      } else if (it.ni !== undefined) {
        const n = state.data.nodes[it.ni];
        state.sel = { type: 'node', ni: it.ni };
        state.floorId = state.data.floors[n[2]] ? state.data.floors[n[2]].id : state.floorId;
        state.view.x = n[0]; state.view.y = n[1];
      } else {
        const lb = state.data.floors[it.fi].labels[it.li];
        state.sel = { type: 'label', fi: it.fi, li: it.li };
        state.floorId = state.data.floors[it.fi].id;
        state.view.x = lb.x; state.view.y = lb.y;
      }
      state.multi = null;
      searchList.style.display = 'none';
      $('searchBox').value = '';
      renderRail(); renderPropPanel(); render();
    };
  });
});
document.addEventListener('click', e => {
  if (!$('searchWrap').contains(e.target)) searchList.style.display = 'none';
});

// ============================== 楼层栏 ==============================
function renderRail() {
  const d = state.data;
  const rail = $('floorRail');
  if (!d) { rail.innerHTML = ''; return; }
  const byId = new Map(d.floors.map((f, i) => [f.id, i]));
  const order = d.meta.floorOrder.filter(id => byId.has(id));
  d.floors.forEach(f => { if (order.indexOf(f.id) < 0) order.push(f.id); });
  rail.innerHTML = order.map(id => {
    const fi = byId.get(id);
    return '<div class="floorBtn' + (id === state.floorId ? ' active' : '') + '" data-fi="' + fi + '">' +
      '<span class="mv" data-mv="up" title="上移">▲</span>' + esc(id) +
      '<span class="mv" data-mv="down" title="下移">▼</span></div>';
  }).join('') +
    '<button id="btnAddFloor" title="新增楼层" style="margin-left:6px">＋层</button>' +
    '<button id="btnDelFloor" class="danger" title="删除当前楼层">－层</button>' +
    '<button id="btnFloorProps" title="楼层属性">层属性</button>';
  rail.querySelectorAll('.floorBtn').forEach(el => {
    el.addEventListener('click', e2 => {
      const fi = Number(el.dataset.fi);
      const mv = e2.target.dataset ? e2.target.dataset.mv : null;
      if (mv) { moveFloorOrder(d.floors[fi].id, mv); return; }
      state.floorId = d.floors[fi].id;
      state.sel = null; state.multi = null;
      renderRail(); renderPropPanel(); render();
    });
  });
  $('btnAddFloor').onclick = addFloor;
  $('btnDelFloor').onclick = () => {
    const fi = curFloorIdx();
    if (fi >= 0) deleteFloor(fi);
  };
  $('btnFloorProps').onclick = () => {
    const fi = curFloorIdx();
    if (fi >= 0) { state.sel = { type: 'floor', fi }; renderPropPanel(); }
  };
}
function moveFloorOrder(id, dir) {
  const d = state.data;
  const fo = d.meta.floorOrder.slice();
  const i = fo.indexOf(id);
  const j = dir === 'up' ? i - 1 : i + 1;
  if (i < 0 || j < 0 || j >= fo.length) return;
  const tmp = fo[i]; fo[i] = fo[j]; fo[j] = tmp;
  pushCmd('调整楼层顺序', [setPatch(d.meta, 'floorOrder', fo)]);
  renderRail();
}
function addFloor() {
  const d = state.data;
  const id = prompt('新楼层编号（如 L16）：');
  if (!id) return;
  if (d.floors.some(f => f.id === id)) { alert('该楼层编号已存在'); return; }
  const level = Number(prompt('垂直层级（地面为 0，如 15）：', '15')) || 0;
  const fl = {
    id: id, name: id, note: '', level: level,
    kind: 'indoor', bounds: [0, 0, 8000, 8000], polys: [], labels: []
  };
  pushCmd('新增楼层 ' + id, [
    insPatch(d.floors, d.floors.length, [fl]),
    setPatch(d.meta, 'floorOrder', [id].concat(d.meta.floorOrder))
  ]);
  state.floorId = id;
  rebuildLinks(); renderRail(); renderPropPanel(); render();
}

// ============================== 模态框 ==============================
function showModal(title, bodyHtml, btns) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHtml;
  const row = $('modalBtns');
  row.innerHTML = '';
  btns.forEach(b => {
    const el = document.createElement('button');
    el.textContent = b.label;
    if (b.cls) el.className = b.cls;
    el.onclick = () => { hideModal(); if (b.fn) b.fn(); };
    row.appendChild(el);
  });
  $('modalMask').style.display = 'flex';
}
function hideModal() { $('modalMask').style.display = 'none'; }

// ============================== 工具栏事件 ==============================
$('btnImport').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const f = e.target.files[0];
  if (f) readJsonFile(f);
  e.target.value = '';
};
function readJsonFile(f) {
  const doRead = () => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        const errs = precheck(obj);
        if (errs.length) {
          showModal('导入失败', '<p>结构预检未通过：</p><ul>' + errs.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>', [{ label: '知道了' }]);
          return;
        }
        importData(obj);
      } catch (err) {
        showModal('导入失败', '<p>JSON 文件解析出错：' + esc(err.message) + '</p>', [{ label: '知道了' }]);
      }
    };
    r.readAsText(f, 'utf-8');
  };
  if (state.dirty) {
    showModal('覆盖当前编辑', '<p>当前有未导出的修改，导入新文件将丢弃（撤销历史也会清空）。继续？</p>', [
      { label: '取消' }, { label: '继续导入', cls: 'danger', fn: doRead }
    ]);
  } else doRead();
}

$('btnExport').onclick = () => {
  if (!state.data) return;
  const result = validate();
  renderValPanel(result);
  const doExport = () => {
    const name = (prompt('导出文件名：', 'map-data.json') || '').trim();
    if (!name) return;
    download(name, exportJSON());
    state.dirty = false;
    $('stDirty').innerHTML = '';
  };
  if (result.errors.length) {
    showModal('校验发现错误',
      '<p>存在 <b style="color:var(--err)">' + result.errors.length + '</b> 个错误级问题（详见右侧校验报告），导出的数据可能被主应用拒绝或产生异常导航。</p><p>仍要导出吗？</p>',
      [{ label: '取消' }, { label: '仍要导出', cls: 'danger', fn: doExport }]);
  } else doExport();
};
$('btnValidate').onclick = () => {
  if (!state.data) return;
  renderValPanel(validate());
};
$('btnUndo').onclick = undo;
$('btnRedo').onclick = redo;
$('toolSel').onchange = e => {
  state.tool = e.target.value;
  state.addEdgeFrom = null;
  state.drawPts = null;
  $('stTool').textContent = '工具: ' + e.target.selectedOptions[0].textContent;
  render();
};
$('refChk').onchange = e => { state.showRef = e.target.checked; render(); };
$('layerMenu').querySelectorAll('[data-layer]').forEach(chk => {
  chk.addEventListener('change', () => {
    state.layers[chk.dataset.layer] = chk.checked;
    render();
  });
});
$('btnDelete').onclick = deleteSelection;
$('panelToggle').onclick = () => $('panel').classList.toggle('open');
$('zoomIn').onclick = () => { state.view.s *= 1.25; render(); };
$('zoomOut').onclick = () => { state.view.s /= 1.25; render(); };
$('zoomFit').onclick = () => { fitView(); render(); };
$('zoomHome').onclick = () => {
  const b = (curFloor() || { bounds: [0, 0, 8000, 8000] }).bounds;
  state.view.x = (b[0] + b[2]) / 2;
  state.view.y = (b[1] + b[3]) / 2;
  render();
};

$('polyTypeSel').innerHTML = POLY_TYPES.map(t => '<option value="' + t + '">' + polyTypeName(t) + '</option>').join('');

// ============================== 键盘 ==============================
window.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    const sel = state.sel;
    if (sel && sel.type === 'poly' && sel.vertex !== null && sel.vertex !== undefined) {
      const po = state.data.floors[sel.fi].polys[sel.pi];
      if (po && po.p.length > 6) {
        const at = sel.vertex * 2;
        const geo = [delPatch(po.p, at, [po.p[at], po.p[at + 1]])];
        pushCmd('删除顶点', withDerive(geo, () => recalcBoundsPatch(sel.fi)));
        state.sel = { type: 'poly', fi: sel.fi, pi: sel.pi, vertex: null };
        renderPropPanel(); render();
        return;
      }
    }
    deleteSelection();
    e.preventDefault();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    undo(); e.preventDefault();
  } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
    redo(); e.preventDefault();
  } else if (e.key === 'Escape') {
    if (state.drawPts) { state.drawPts = null; render(); }
    else if (state.addEdgeFrom !== null && state.addEdgeFrom !== undefined) { state.addEdgeFrom = null; render(); }
    else if (state.sel || state.multi) { state.sel = null; state.multi = null; renderPropPanel(); render(); }
  } else if (e.key === 'Enter') {
    if (state.drawPts) finishDrawPoly();
  }
});

window.addEventListener('resize', render);
window.addEventListener('beforeunload', e => {
  if (state.dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
</script>
